services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail}
      POSTGRES_DB: ${POSTGRES_DB:-retail}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retail}"]
      interval: 5s
      retries: 10

  mlflow:
    image: python:3.11-slim
    command: sh -c "pip install -q mlflow && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts"
    ports: ["5000:5000"]
    volumes: [mlflowdata:/mlflow]

  airflow:
    build: { context: ., dockerfile: Dockerfile.airflow }
    command: standalone          # webserver + scheduler + local sqlite metadata DB; fine for a local demo
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail}
      POSTGRES_DB: ${POSTGRES_DB:-retail}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/orchestration/dags
    ports: ["8080:8080"]
    volumes:
      - .:/opt/airflow/project

volumes:
  pgdata:
  mlflowdata:
