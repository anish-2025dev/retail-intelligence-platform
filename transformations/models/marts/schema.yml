version: 2
models:
  - name: fact_orders
    description: One row per order with value, delivery and review metrics. Delivery metrics are null for undelivered orders.
    columns:
      - {name: order_id, tests: [unique, not_null]}
      - name: customer_key
        tests:
          - not_null
          - relationships: {to: ref('dim_customers'), field: customer_key}
      - name: order_status
        tests:
          - accepted_values:
              values: [created, approved, invoiced, processing, shipped, delivered, unavailable, canceled]
      - {name: review_score, description: "Average review score 1-5, null if no review"}
  - name: fact_order_items
    columns:
      - name: product_key
        tests: [{relationships: {to: ref('dim_products'), field: product_key}}]
      - name: seller_key
        tests: [{relationships: {to: ref('dim_sellers'), field: seller_key}}]
  - name: dim_customers
    columns: [{name: customer_key, tests: [unique, not_null]}]
  - name: dim_products
    columns: [{name: product_key, tests: [unique, not_null]}]
  - name: dim_sellers
    columns: [{name: seller_key, tests: [unique, not_null]}]
  - name: dim_date
    columns: [{name: date_key, tests: [unique, not_null]}]
  - name: mart_category_monthly_sales
    description: Monthly revenue per category (excludes canceled/unavailable orders). Feeds Power BI page 3.
  - name: mart_seller_performance
    description: Seller order volume, late-delivery rate (delivered orders only) and review score.
  - name: mart_delivery_vs_reviews
    description: Delivery performance and review scores by customer state.
